[package]
name = "dicing_splicing"
version = "0.1.0"
edition = "2021"
default-run = "dicing_splicing"

[dependencies]
eframe = "0.29.1"
egui = "0.29.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

image = { version = "0.25", default-features = false, features = ["jpeg"] }
cpal = "0.18.2"
rfd = "0.17.2"

# Plugins are separate programs, and the editor finds them next to itself. `cargo build` builds them
# too; `cargo run` builds only the editor, so after changing a plugin it takes `cargo build`.
[workspace]
members = ["plugins/link", "plugins/telegram"]
default-members = [".", "plugins/link", "plugins/telegram"]

# JPEG decoding and audio mixing are too slow without optimizations; keep our own code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Function names and lines in the error reports of a released editor: the .pdb next to the program
# holds them, and scripts/package.ps1 puts it there.
[profile.release]
debug = "line-tables-only"
