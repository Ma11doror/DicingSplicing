[package]
name = "simple_editor"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29.1"
egui = "0.29.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

image = { version = "0.25", default-features = false, features = ["jpeg"] }
cpal = "0.18.2"
rfd = "0.17.2"

# JPEG decoding and audio mixing are too slow without optimizations; keep our own code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
